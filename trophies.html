<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barca_Trophies</title>
    <link rel="icon" type="image/jpeg" href="Barca Logo.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg, #004d98, #a50044);
            color: #222;
        }

        .nav {
            background: linear-gradient(90deg, #004d98, #a50044);
            padding: 12px 50px;
        }

        .menues {
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 50px;
            height: 50px;
        }

        .menues li {
            margin: 0 15px;
            color: #fff;
        }

        .menues a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
        }

        .trophies {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            padding: 100px 20px;
        }

        .trophies h1 {
            font-size: 48px;
        }

        .trophies h2 {
            font-size: 32px;
        }

        .img4 {
            text-align: center;
            padding: 50px 20px;
        }

        .img4 img {
            width: 80%;
            max-width: 400px;
        }
    </style>
</head>

<body>

    <nav class="nav">
        <ul class="menues">
            <li>
                <a href="index.html">
                    <img src="Barca Logo.jpg" alt="logo" class="logo">
                </a>
            </li>

            <li>
                <a href="squadlist.html">squadlist</a>
            </li>

            <li>
                <a href="trophies.html">Trophies</a>
            </li>
        </ul>
    </nav>

    <section class="trophies">

        <div class="squad">
            <h1>Our Trophies</h1>
            <p>You must know how many trophies this club has won.</p>

            <ul>
                <h2>La Liga</h2>
                <li>26</li>

                <h2>Copa Del Rey</h2>
                <li>31</li>

                <h2>Supercopa De Espana</h2>
                <li>14</li>

                <h2>UEFA Champions League</h2>
                <li>5</li>

                <h2>UEFA Super Cup</h2>
                <li>5</li>

                <h2>FIFA Club World Cup</h2>
                <li>3</li>
            </ul>
        </div>

        <div class="img4">
            <img src="./Trophies.jpg" alt="Trophies Image">
        </div>

    </section>

    <audio autoplay loop>
        <source src="Blaugrana-son-els-colors.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
